<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- 左臂：终端窗口图标 -->
  <rect x="96" y="208" width="72" height="52" rx="8" stroke="#71717a" stroke-width="5" fill="none" opacity="0.7"/>
  <polyline points="110,230 122,240 110,250" stroke="#a1a1aa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <line x1="130" y1="248" x2="148" y2="248" stroke="#a1a1aa" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

  <!-- 右臂：浏览器窗口图标 -->
  <rect x="344" y="208" width="72" height="52" rx="8" stroke="#71717a" stroke-width="5" fill="none" opacity="0.7"/>
  <line x1="344" y1="224" x2="416" y2="224" stroke="#71717a" stroke-width="3" opacity="0.5"/>
  <circle cx="356" cy="216" r="3" fill="#a1a1aa" opacity="0.6"/>
  <circle cx="366" cy="216" r="3" fill="#a1a1aa" opacity="0.6"/>
  <circle cx="376" cy="216" r="3" fill="#a1a1aa" opacity="0.6"/>

  <!-- 地球网格 -->
  <circle cx="380" cy="242" r="14" stroke="#a1a1aa" stroke-width="2.5" fill="none" opacity="0.6"/>
  <ellipse cx="380" cy="242" rx="7" ry="14" stroke="#a1a1aa" stroke-width="2" fill="none" opacity="0.4"/>
  <line x1="366" y1="242" x2="394" y2="242" stroke="#a1a1aa" stroke-width="2" opacity="0.4"/>

  <!-- 底座 -->
  <path d="M112 370 L256 432 L400 370 L400 330 L256 268 L112 330 Z"
        stroke="#71717a" stroke-width="20" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
  <!-- 底座内线 -->
  <path d="M160 355 L256 395 L352 355 L352 340 L256 300 L160 340 Z"
        stroke="#a1a1aa" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" fill="none" opacity="0.25"/>

  <!-- 中心竖线 -->
  <line x1="256" y1="268" x2="256" y2="168" stroke="#71717a" stroke-width="16" stroke-linecap="round"/>

  <!-- 两侧调度通道 -->
  <line x1="176" y1="350" x2="256" y2="168" stroke="#a1a1aa" stroke-width="10" stroke-linecap="round" opacity="0.3"/>
  <line x1="336" y1="350" x2="256" y2="168" stroke="#a1a1aa" stroke-width="10" stroke-linecap="round" opacity="0.3"/>

  <!-- 枢纽核心 -->
  <circle cx="256" cy="148" r="16" fill="#a1a1aa"/>

  <!-- 发散线 -->
  <line x1="256" y1="124" x2="168" y2="68" stroke="#71717a" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="124" x2="344" y2="68" stroke="#71717a" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="124" x2="256" y2="44" stroke="#71717a" stroke-width="10" stroke-linecap="round"/>

  <!-- 智能体节点 -->
  <circle cx="168" cy="58" r="16" fill="none" stroke="#71717a" stroke-width="6"/>
  <circle cx="344" cy="58" r="16" fill="none" stroke="#71717a" stroke-width="6"/>
  <circle cx="256" cy="34" r="16" fill="none" stroke="#71717a" stroke-width="6"/>
  <circle cx="168" cy="58" r="5" fill="#a1a1aa"/>
  <circle cx="344" cy="58" r="5" fill="#a1a1aa"/>
  <circle cx="256" cy="34" r="5" fill="#a1a1aa"/>
</svg>
