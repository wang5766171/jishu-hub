schema = 1
kind = "tool"

[info]
id = "task-plan"
display_name = "流程规划"

[pi_extension]
entry = "plan.ts"
target_agent = "jishu-self"

[tool]
description = "提交结构化流程计划（产出 flow-plan.json + flow-plan.md，适合需要分步骤执行的场景）"
usage = "jishu-cli task-artifact commit-plan --nodes '<JSON数组>' --project $JISHU_PROJECT_PATH"
example = "jishu-cli task-artifact commit-plan --nodes '[{\"id\":\"n1\",\"title\":\"分析瓶颈\",\"depends_on\":[],\"role\":\"developer\"}]' --project $JISHU_PROJECT_PATH"
notes = "nodes JSON: [{id, title, responsibility, depends_on, acceptance, role}]。觉得开发不复杂时可不调此工具直接执行。"
