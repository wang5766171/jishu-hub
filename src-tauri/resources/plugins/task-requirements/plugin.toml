schema = 1
kind = "tool"

[info]
id = "task-requirements"
display_name = "需求讨论"

[pi_extension]
entry = "discuss.ts"
target_agent = "jishu-self"

[tool]
description = "结构化需求收敛工具——仅当需求足够复杂、模糊或多方约束需要头脑风暴式确认时使用。产出 REQUIREMENTS.md 结构化需求文档。简单明确的需求（一句话能说清做什么）绝对不要使用此工具，直接实现即可。"
usage = "jishu-cli task-artifact lock-requirement --title <标题> --goal <目标> --scope <范围;分隔> --acceptance <验收标准;分隔> --project $JISHU_PROJECT_PATH"
example = "jishu-cli task-artifact lock-requirement --title '多租户SaaS权限系统' --goal '实现RBAC+数据隔离' --scope '角色管理;权限矩阵;租户隔离' --acceptance '跨租户数据不可见;权限变更实时生效' --project $JISHU_PROJECT_PATH"
notes = """何时使用（全部满足才用）：
1. 需求涉及多个子系统/模块，或有多方约束（性能/安全/兼容性）需要权衡
2. 用户的需求描述存在明显歧义或空白（说不清范围边界、验收标准）
3. 用户明确要求"先讨论需求"或"做需求分析"

何时不用（满足任一条就不要用）：
- 需求一句话能说清做什么（如"写个登录页"、"加个按钮"、"修个bug"）→ 直接实现
- 用户给了明确的技术方案或参考（如"照着XX做"）→ 直接实现
- 你已经能完整列出功能清单和验收标准 → 直接实现

判断原则：只有当你自己都无法确定"做什么、不做什么、怎么算做完"这三个问题时，才需要此工具。"""
