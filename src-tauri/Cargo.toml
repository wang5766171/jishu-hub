[package]
name = "jishu-hub"
version = "0.5.5"
description = "A desktop hub for managing AI agent projects, sessions, and configuration"
authors = ["wang5766171"]
license = "MIT"
repository = "https://github.com/wang5766171/jishu-hub"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
tokio = { version = "1", features = ["process", "io-util", "net", "time"] }
base64 = "0.22"
open = "5"
bitflags = "2"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
