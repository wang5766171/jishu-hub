[package]
name = "jishu-hub"
version = "0.8.0"
description = "A desktop hub for managing AI agent projects, sessions, and configuration"
authors = ["wang5766171"]
license = "MIT"
repository = "https://github.com/wang5766171/jishu-hub"
edition = "2021"
rust-version = "1.77.2"
default-run = "jishu-hub"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "jishu-cli"
path = "src/bin/jishu-cli.rs"

[features]
default = ["cli", "orchestrator"]
cli = ["clap"]
orchestrator = []

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
tokio = { version = "1", features = ["process", "io-util", "net", "time", "macros", "sync"] }
base64 = "0.22"
open = "5"
bitflags = "2"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
clap = { version = "4", features = ["derive", "env"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.27.0"

[profile.dev]
# 缩小 debug 构建产物：默认 debug=2 生成完整调试信息（deps 膨胀主因）。
# 1 = 只保留行号表（够定位 panic 行、基本栈回溯），deps 显著缩小。
# 若需 IDE 断点查变量值，临时改回 2。
debug = 1
