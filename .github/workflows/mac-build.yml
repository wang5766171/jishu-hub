name: macOS Build

on:
  push:
    branches:
      - main
      - master
      - feature/*
      - release_*
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Install dependencies
        run: npm install

      - name: Build Full version
        run: npm run tauri build

      - name: Rename Full artifacts
        run: |
          mv src-tauri/target/release/bundle/dmg/*.dmg "src-tauri/target/release/bundle/dmg/Jishu Hub Full.dmg"

      - name: Upload Full artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JishuHub-Full-macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Clean up old DMG
        run: rm -rf src-tauri/target/release/bundle/dmg/*

      - name: Build Lite version
        run: npm run tauri build -- --config src-tauri/tauri.conf.lite.json

      - name: Rename Lite artifacts
        run: |
          mv src-tauri/target/release/bundle/dmg/*.dmg "src-tauri/target/release/bundle/dmg/Jishu Hub Lite.dmg"

      - name: Upload Lite artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JishuHub-Lite-macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg
